[package]
name = "underway-example-memory-basic"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
underway = { path = "../..", default-features = false, features = ["memory"] }
