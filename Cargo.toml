[workspace]
members = [
  ".",
  "crates/underway-core",
  "crates/underway-memory",
  "crates/underway-postgres",
  "examples/activities",
  "examples/basic",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maxcountryman/underway"
documentation = "https://docs.rs/underway"

[workspace.dependencies]
jiff = { version = "0.1.13", features = ["serde"] }
jiff-cron = "0.1.0"
num_cpus = "1.16.0"
rand = "0.9.2"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sqlx = { version = "0.8.2", features = [
  "postgres",
  "runtime-tokio-rustls",
  "uuid",
  "json",
] }
thiserror = "2.0.0"
tokio = { version = "1.40.0", features = ["full"] }
tokio-util = "0.7.12"
tracing = { version = "0.1.40", features = ["log"] }
ulid = { version = "1.1.3", features = ["uuid"] }
uuid = { version = "1.10.0", features = ["v4", "serde"] }

[package]
name = "underway"
description = "Durable background workflows with pluggable backends"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords = ["background-workflows", "workflow-queue", "work-queue", "durable", "web"]
categories = ["asynchronous", "database", "web-programming"]
repository.workspace = true
documentation.workspace = true

[features]
default = ["memory", "postgres"]
memory = ["dep:underway-memory"]
postgres = ["dep:underway-postgres"]

[dependencies]
underway-core = { path = "crates/underway-core" }
underway-memory = { path = "crates/underway-memory", optional = true }
underway-postgres = { path = "crates/underway-postgres", optional = true }
